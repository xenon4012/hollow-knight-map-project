<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path Suggestion</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="tree">

  <div class="node root">King’s Pass</div>

  <div class="branch">

    <div class="node">Forgotten Crossroads</div>

    <div class="branch">

      <div class="node">Greenpath</div>

      <div class="branch">
        <div class="node">Fungal Wastes</div>

        <div class="branch">
          <div class="node">City of Tears</div>

          <div class="branch split">

            <div class="path">
              <div class="node">Crystal Peak</div>
              <div class="node">Resting Grounds</div>
            </div>

            <div class="path">
              <div class="node">Deepnest</div>
              <div class="node">Kingdom’s Edge</div>
            </div>

          </div>

          <div class="node">Ancient Basin</div>

          <div class="branch">
            <div class="node">The Abyss</div>
          </div>

        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
