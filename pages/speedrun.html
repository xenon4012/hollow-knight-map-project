<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedrun Route by fireB0rn</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Spectral:wght@300;400&display=swap');
        
        body {
            font-family: "Cinzel", serif;
            text-align: center;
            background:
                radial-gradient(circle at top, #1b2438 0%, #0c1018 40%, #05070b 100%);
            color: white;
            margin: 0;
            padding: 20px;
        }

        img {
            max-width: 95%;
            max-height: 80vh;
            border: 2px solid white;
        }

        button {
            max-width: 1100px;
            font-family: "Cinzel", serif;
            color: #eef5ff;
            margin: 0 auto 40px auto;
            padding: 25px;
            background: rgba(18, 24, 35, 0.85);
            border: 1px solid #3c4d68;
            border-radius: 12px;
            box-shadow:
                0 0 15px rgba(125, 185, 255, 0.08),
                inset 0 0 15px rgba(255, 255, 255, 0.03);

            transition: all 0.2s ease;
        }

        button:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .home-btn {
            background: #14532d;
            border-color: #22c55e;
        }

        .home-btn:hover {
            background: #16a34a;
        }

        #menu {
            margin: 20px auto;
            max-width: 800px;
        }

        #menu button {
            display: block;
            width: 100%;
            margin: 8px 0;
        }

        #caption {
            margin-bottom: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        /* Menu container matches your styled sections */
        #menu {
            max-width: 1100px;
            margin: 0 auto 40px auto;
            padding: 25px;
            background: rgba(18, 24, 35, 0.85);
            border: 1px solid #3c4d68;
            border-radius: 12px;
            box-shadow:
                0 0 15px rgba(125, 185, 255, 0.08),
                inset 0 0 15px rgba(255, 255, 255, 0.03);
        }

        /* Menu title (matches your h3 style) */
        #menu h3 {
            font-family: "Cinzel", serif;
            font-size: 2rem;
            color: #eef5ff;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(180, 220, 255, 0.4);
        }

        /* Make menu behave like your navigation list */
        #menu ul {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            padding: 0;
        }

        /* Each section item */
        #menu li {
            margin: 5px;
        }

        /* The “table-style button” */
        #menu li a {
            display: inline-block;
            text-decoration: none;
            color: #dce8ff;

            padding: 10px 18px;
            border: 1px solid #5a7297;
            border-radius: 8px;

            background: rgba(30, 42, 61, 0.7);
            transition: all 0.25s ease;
        }

        /* Hover effect (same as your nav links) */
        #menu li a:hover {
            color: white;
            border-color: #9bd0ff;
            box-shadow: 0 0 10px rgba(130, 200, 255, 0.5);
            transform: translateY(-2px);
        }
    </style>

    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <h1>Speedrun Route by fireB0rn</h1>

    <div id="caption"></div>

    <div id="menu" style="display:none;"></div>

    <img id="slide" src="" alt="Speedrun Route">

    <br>

    <button onclick="previousSlide()">⬅ Previous</button>
    <button class="home-btn" onclick="goHome()">🏠 Home</button>
    <button onclick="nextSlide()">Next ➡</button>

    <script>
        const slides = [
            {
                title: "Jump to Section",
                menu: true
            },
            {
                image: "../images/speedrun/overview.PNG",
                title: "Overview"
            },
            {
                image: "../images/speedrun/1.PNG",
                title: "Segment 1: Vengeful Spirit"
            },
            {
                image: "../images/speedrun/2.PNG",
                title: "Segment 2: Mothwing Cloak"
            },
            {
                image: "../images/speedrun/3.PNG",
                title: "Segment 3: Mantis Claw"
            },
            {
                image: "../images/speedrun/4.PNG",
                title: "Segment 4: Soul Sanctum"
            },
            {
                image: "../images/speedrun/5.PNG",
                title: "Segment 5: Gruz Mother"
            },
            {
                image: "../images/speedrun/6.PNG",
                title: "Segment 6: Crystal Peak"
            },
            {
                image: "../images/speedrun/7.PNG",
                title: "Segment 7: Isma's Tear / Lurien"
            },
            {
                image: "../images/speedrun/8.PNG",
                title: "Segment 8: Monomon"
            },
            {
                image: "../images/speedrun/9.PNG",
                title: "Segment 9: Herrah"
            },
            {
                image: "../images/speedrun/10.PNG",
                title: "Segment 10: Hollow Knight"
            }
        ];

        let currentSlide = 0;

        function showSlide(index) {
            const slide = slides[index];

            document.getElementById("caption").textContent =
                `${index + 1}/${slides.length} - ${slide.title}`;

            const img = document.getElementById("slide");
            const menu = document.getElementById("menu");

            if (slide.menu) {
                img.style.display = "none";
                menu.style.display = "block";

                menu.innerHTML = `
                    <h2>Select a Section</h2>
                    ${slides.slice(1).map((s, i) =>
                        `<button onclick="jumpTo(${i + 1})">${s.title}</button>`
                    ).join("")}
                `;
            } else {
                img.style.display = "block";
                menu.style.display = "none";
                img.src = slide.image;
            }
        }

        function jumpTo(index) {
            currentSlide = index;
            showSlide(currentSlide);
        }

        function goHome() {
            currentSlide = 0;
            showSlide(currentSlide);
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % slides.length;
            showSlide(currentSlide);
        }

        function previousSlide() {
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            showSlide(currentSlide);
        }

        document.addEventListener("keydown", (event) => {
            if (event.key === "ArrowRight") nextSlide();
            if (event.key === "ArrowLeft") previousSlide();
            if (event.key.toLowerCase() === "h") goHome();
        });

        showSlide(currentSlide);
    </script>

</body>
</html>
